[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texllm"
version = "0.1.0"
description = "T-ex LLM — portable multi-agent host, team workers, and agentic firmware"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.27.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.5.0,<3",
  "pydantic-settings>=2.1.0,<3",
  "pyyaml>=6.0.1,<7",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0,<9"]

[project.scripts]
texllm = "texllm.cli:main"
texllm-host = "texllm.host.app:main"
texllm-run = "texllm.cli:main"
texllm-serve = "texllm.host.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["texllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
